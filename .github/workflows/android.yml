name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception|expected" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DemoTape.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DemoTape.apk \
            --target "$GITHUB_SHA" \
            --title "Demo-tape 1.${{ github.run_number }}" \
            --notes "Open this page on your Android phone, tap DemoTape.apk to download, then open the file to install. Built from ${GITHUB_SHA::7}."
